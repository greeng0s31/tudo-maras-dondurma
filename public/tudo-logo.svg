<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%" fill="none">
  <defs>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFD700" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="badgeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1817"/>
      <stop offset="100%" stop-color="#11100F"/>
    </linearGradient>
    <path id="tudoArch" d="M 80,140 Q 250,55 420,140" fill="none" />
    <path id="bottomArch" d="M 80,560 Q 250,640 420,560" fill="none" />
  </defs>

  <!-- Top Curved "T U D O" text -->
  <text font-family="'Montserrat', 'Poppins', sans-serif" font-size="64" font-weight="900" fill="#1A1A1A" letter-spacing="14">
    <textPath href="#tudoArch" startOffset="50%" text-anchor="middle">
      TUDO
    </textPath>
  </text>
  <!-- Registered Trademark (R) symbol -->
  <g transform="translate(425, 95)">
    <circle cx="15" cy="15" r="14" stroke="#1A1A1A" stroke-width="3" fill="none"/>
    <text x="15" y="21" font-family="'Montserrat', sans-serif" font-size="16" font-weight="900" fill="#1A1A1A" text-anchor="middle">R</text>
  </g>

  <!-- Stars flanking top badge -->
  <!-- Left top star -->
  <path d="M 85,235 L 90,248 L 103,248 L 93,256 L 97,269 L 85,260 L 73,269 L 77,256 L 67,248 L 80,248 Z" fill="#1A1A1A" transform="scale(1.2) translate(-15, -35)"/>
  <!-- Right top star -->
  <path d="M 335,235 L 340,248 L 353,248 L 343,256 L 347,269 L 335,260 L 323,269 L 327,256 L 317,248 L 330,248 Z" fill="#1A1A1A" transform="scale(1.2) translate(-35, -35)"/>

  <!-- Side Ribbon Flags -->
  <!-- Left Ribbon -->
  <g>
    <path d="M 20,270 L 130,270 L 130,370 L 20,370 L 60,320 Z" fill="#1A1817" stroke="#FFD700" stroke-width="7" stroke-linejoin="round"/>
    <!-- Star on left ribbon -->
    <path d="M 85,320 L 89,331 L 101,331 L 91,339 L 95,350 L 85,342 L 75,350 L 79,339 L 69,331 L 81,331 Z" fill="#FFD700" transform="translate(-5, -15)"/>
  </g>

  <!-- Right Ribbon -->
  <g>
    <path d="M 480,270 L 370,270 L 370,370 L 480,370 L 440,320 Z" fill="#1A1817" stroke="#FFD700" stroke-width="7" stroke-linejoin="round"/>
    <!-- Star on right ribbon -->
    <path d="M 415,320 L 419,331 L 431,331 L 421,339 L 425,350 L 415,342 L 405,350 L 409,339 L 399,331 L 411,331 Z" fill="#FFD700" transform="translate(0, -15)"/>
  </g>

  <!-- Central Scalloped Oval Badge -->
  <!-- Outer Badge Body -->
  <path d="
    M 250,150
    C 310,150 350,175 365,220
    C 375,250 365,275 385,320
    C 405,365 375,410 365,435
    C 345,480 310,530 250,530
    C 190,530 155,480 135,435
    C 125,410 95,365 115,320
    C 135,275 125,250 135,220
    C 150,175 190,150 250,150 Z" 
    fill="url(#badgeDark)" 
    stroke="#FFD700" 
    stroke-width="12" 
    filter="url(#goldGlow)"
  />

  <!-- Inner Badge Line -->
  <path d="
    M 250,166
    C 302,166 338,188 351,228
    C 360,255 351,277 369,320
    C 387,360 360,400 351,422
    C 333,463 302,514 250,514
    C 198,514 167,463 149,422
    C 140,400 113,360 131,320
    C 149,277 140,255 149,228
    C 162,188 198,166 250,166 Z" 
    fill="none" 
    stroke="#FFD700" 
    stroke-width="3" 
    opacity="0.85"
  />

  <!-- Center Motif: Ice Cream Cone and Scoops -->
  <!-- Top Scoop -->
  <circle cx="250" cy="255" r="42" fill="none" stroke="#FFD700" stroke-width="7"/>
  <!-- Left Lower Scoop -->
  <circle cx="222" cy="300" r="40" fill="none" stroke="#FFD700" stroke-width="7"/>
  <!-- Right Lower Scoop -->
  <circle cx="278" cy="300" r="40" fill="none" stroke="#FFD700" stroke-width="7"/>

  <!-- Cone Collar / Rim -->
  <rect x="178" y="325" width="144" height="24" rx="4" fill="url(#badgeDark)" stroke="#FFD700" stroke-width="7"/>

  <!-- Waffle Cone -->
  <path d="M 194,352 L 306,352 L 250,490 Z" fill="url(#badgeDark)" stroke="#FFD700" stroke-width="7" stroke-linejoin="round"/>

  <!-- Waffle Cone Grid Pattern Lines -->
  <!-- Diagonal lines left to right -->
  <line x1="208" y1="354" x2="260" y2="466" stroke="#FFD700" stroke-width="4"/>
  <line x1="228" y1="354" x2="274" y2="430" stroke="#FFD700" stroke-width="4"/>
  <line x1="248" y1="354" x2="288" y2="395" stroke="#FFD700" stroke-width="4"/>
  <line x1="268" y1="354" x2="298" y2="372" stroke="#FFD700" stroke-width="4"/>
  <line x1="198" y1="380" x2="252" y2="486" stroke="#FFD700" stroke-width="4"/>
  <line x1="208" y1="418" x2="251" y2="488" stroke="#FFD700" stroke-width="4"/>

  <!-- Diagonal lines right to left -->
  <line x1="292" y1="354" x2="240" y2="466" stroke="#FFD700" stroke-width="4"/>
  <line x1="272" y1="354" x2="226" y2="430" stroke="#FFD700" stroke-width="4"/>
  <line x1="252" y1="354" x2="212" y2="395" stroke="#FFD700" stroke-width="4"/>
  <line x1="232" y1="354" x2="202" y2="372" stroke="#FFD700" stroke-width="4"/>
  <line x1="302" y1="380" x2="248" y2="486" stroke="#FFD700" stroke-width="4"/>
  <line x1="292" y1="418" x2="249" y2="488" stroke="#FFD700" stroke-width="4"/>

  <!-- "Since 1981" inside badge below cone -->
  <text x="250" y="505" font-family="'Montserrat', 'Poppins', sans-serif" font-size="20" font-weight="600" fill="#FFD700" text-anchor="middle" letter-spacing="2">
    Since 1981
  </text>

  <!-- Stars flanking "Babadan Oğula" at bottom -->
  <!-- Left bottom star -->
  <path d="M 80,555 L 85,568 L 98,568 L 88,576 L 92,589 L 80,580 L 68,589 L 72,576 L 62,568 L 75,568 Z" fill="#1A1A1A" transform="scale(1.2) translate(-20, -105)"/>
  <!-- Right bottom star -->
  <path d="M 345,555 L 350,568 L 363,568 L 353,576 L 357,589 L 345,580 L 333,589 L 337,576 L 327,568 L 340,568 Z" fill="#1A1A1A" transform="scale(1.2) translate(-35, -105)"/>

  <!-- Bottom Arch "Babadan Oğula" -->
  <text font-family="'Montserrat', 'Poppins', sans-serif" font-size="36" font-weight="800" fill="#1A1A1A" letter-spacing="6">
    <textPath href="#bottomArch" startOffset="50%" text-anchor="middle">
      Babadan Oğula
    </textPath>
  </text>
</svg>
